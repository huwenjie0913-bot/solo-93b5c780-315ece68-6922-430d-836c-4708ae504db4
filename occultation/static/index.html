<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掩星弦线拟合台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>掩星弦线拟合台</h1>
  <div class="hdr-controls">
    <select id="eventSelect" title="选择事件"></select>
    <button id="btnNewEvent">新建事件</button>
    <button id="btnExport" disabled>导出 JSON</button>
  </div>
</header>

<main>
  <!-- 左栏：事件参数 + 站点/观测录入 -->
  <aside id="leftPanel">
    <section class="card">
      <h2>事件参数</h2>
      <label>影子速度 (km/s)<input id="inpVelocity" type="number" step="0.1"></label>
      <label>运动方向 PA (°，自北向东)<input id="inpDirection" type="number" step="0.1"></label>
      <label>拟合模型
        <select id="selModel">
          <option value="circle">圆形</option>
          <option value="ellipse">椭圆</option>
        </select>
      </label>
      <label>统一时间偏移 (s)：<b id="offsetVal">0.00</b></label>
      <input id="rngOffset" type="range" min="-5" max="5" step="0.05" value="0">
      <div class="row">
        <input id="numOffset" type="number" step="0.05" style="width:90px">
        <button id="btnApplyParams">应用参数</button>
      </div>
    </section>

    <section class="card">
      <h2>站点</h2>
      <div class="grid4">
        <input id="staName" placeholder="站名">
        <input id="staLat" type="number" step="0.0001" placeholder="纬度°">
        <input id="staLon" type="number" step="0.0001" placeholder="经度°">
        <button id="btnAddSta">添加</button>
      </div>
      <table id="staTable">
        <thead><tr><th>站名</th><th>纬度</th><th>经度</th><th>排除</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>观测记录</h2>
      <div class="grid4">
        <select id="obsSta"></select>
        <select id="obsKind">
          <option value="positive">正观测（掩）</option>
          <option value="negative">负观测（未掩）</option>
        </select>
      </div>
      <div class="grid4" id="posFields">
        <input id="obsT1" placeholder="消失 03:14:22.5">
        <input id="obsT2" placeholder="复现 03:14:29.1">
        <input id="obsE1" type="number" step="0.01" placeholder="σ消失 s">
        <input id="obsE2" type="number" step="0.01" placeholder="σ复现 s">
      </div>
      <div class="grid4 hidden" id="negFields">
        <input id="obsTN" placeholder="时刻 03:14:25.0">
        <input id="obsEN" type="number" step="0.01" placeholder="σ s">
      </div>
      <button id="btnAddObs">添加观测</button>
      <table id="obsTable">
        <thead><tr><th>站点</th><th>类型</th><th>时刻</th><th>σ(s)</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>批量导入（CSV 文本）</h2>
      <p class="hint">STA,站名,纬,经 / POS,站名,消失,复现,σ1,σ2 / NEG,站名,时刻,σ</p>
      <textarea id="csvText" rows="5" placeholder="STA, 甲站, 31.20, 121.40&#10;POS, 甲站, 03:14:22.5, 03:14:29.1, 0.2, 0.3"></textarea>
      <div class="row">
        <button id="btnImport">导入</button>
        <button id="btnDemo">载入示例数据</button>
      </div>
      <div id="importMsg" class="hint"></div>
    </section>
  </aside>

  <!-- 中栏：画布 + 拟合结果 -->
  <section id="centerPanel">
    <div class="card canvasCard">
      <canvas id="mainCanvas" width="900" height="640"></canvas>
      <div class="hint">点击弦线可切换该站“排除/启用”；负观测 ⊘ 红色表示与轮廓冲突。</div>
    </div>
    <div class="card">
      <h2>拟合结果</h2>
      <div id="fitSummary" class="kv">尚无拟合</div>
      <div id="conflicts" class="conflicts"></div>
    </div>
    <div class="card">
      <h2>残差</h2>
      <table id="resTable">
        <thead><tr><th>站点</th><th>中点残差 km</th><th>σ</th><th>弦长残差 km</th><th>σ</th><th>备注</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- 右栏：快照 -->
  <aside id="rightPanel">
    <section class="card">
      <h2>方案快照</h2>
      <div class="row">
        <input id="snapLabel" placeholder="方案说明">
        <button id="btnSaveSnap">保存快照</button>
      </div>
      <ul id="snapList" class="snapList"></ul>
    </section>
    <section class="card">
      <h2>并排比较</h2>
      <div class="row">
        <select id="cmpA"></select>
        <select id="cmpB"></select>
        <button id="btnCompare">比较</button>
      </div>
      <p class="hint">选择两个快照后并排显示弦线、轮廓与参数差异。</p>
    </section>
  </aside>
</main>

<!-- 比较视图 -->
<div id="cmpModal" class="modal hidden">
  <div class="modalBody">
    <div class="row spaceBetween">
      <h2>快照比较</h2>
      <button id="btnCloseCmp">关闭</button>
    </div>
    <div class="cmpWrap">
      <div><h3 id="cmpTitleA"></h3><canvas id="cmpCanvasA" width="560" height="440"></canvas></div>
      <div><h3 id="cmpTitleB"></h3><canvas id="cmpCanvasB" width="560" height="440"></canvas></div>
    </div>
    <h3>参数差异</h3>
    <table id="cmpTable">
      <thead><tr><th>参数</th><th id="cmpHeadA">A</th><th id="cmpHeadB">B</th><th>差 (B−A)</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- 新建事件对话框 -->
<div id="evtModal" class="modal hidden">
  <div class="modalBody narrow">
    <h2>新建观测事件</h2>
    <label>事件名称<input id="evtName" placeholder="如 (319) Leona 掩星"></label>
    <label>目标星<input id="evtStar" placeholder="如 TYC 1234-567"></label>
    <label>日期<input id="evtDate" placeholder="2026-09-14"></label>
    <label>影子速度 (km/s)<input id="evtVel" type="number" value="20" step="0.1"></label>
    <label>运动方向 PA (°)<input id="evtDir" type="number" value="90" step="0.1"></label>
    <div class="row">
      <button id="btnCreateEvt">创建</button>
      <button id="btnCancelEvt">取消</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
